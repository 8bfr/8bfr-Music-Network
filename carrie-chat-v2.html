<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrie Chat v2 - 8BFR</title>
<style>
  body { font-family: system-ui; background: #0a0618; color: #fff; margin: 0; }
  #avatar-container { position: relative; width: 400px; height: 600px; margin: 20px auto; }
  #avatar-base { position: absolute; width: 100%; height: 100%; object-fit: contain; }
  .avatar-item { position: absolute; pointer-events: none; }
  #closet { max-width: 800px; margin: 0 auto; padding: 20px; }
  .item-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .item-card { background: #1a1030; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; }
  .item-card img { width: 100%; height: 80px; object-fit: contain; }
  .item-card.equipped { border: 2px solid #a855f7; }
  .coin-cost { color: #fbbf24; font-size: 12px; }
</style>
</head>
<body>
<div id="avatar-container">
  <img id="avatar-base" src="assets/images/v2/bases/male_light.png" alt="avatar">
  <!-- Items injected here -->
</div>
<div id="closet">
  <h2>Closet v2</h2>
  <div>Coins: <span id="coins">1000</span></div>
  <div class="item-grid" id="item-grid"></div>
</div>
<script>
// v2 Avatar System - exact pixel positioning on 800x1200 base, displayed at 400x600
const SCALE = 0.5; // display scale
const ITEMS = [
  // Hair - head at (400, 150) on base
  {id:'v2_m_fade', name:'Fade', slot:'hair', gender:'male', coins:12, img:'assets/images/v2/hair/m_fade.png', x:400, y:120, w:260},
  {id:'v2_m_dreads', name:'Dreads', slot:'hair', gender:'male', coins:14, img:'assets/images/v2/hair/m_dreads.png', x:400, y:120, w:280},
  {id:'v2_m_buzz', name:'Buzz Cut', slot:'hair', gender:'male', coins:12, img:'assets/images/v2/hair/m_buzz.png', x:400, y:120, w:250},
  {id:'v2_m_sidepart', name:'Side Part', slot:'hair', gender:'male', coins:12, img:'assets/images/v2/hair/m_sidepart.png', x:400, y:120, w:260},
  {id:'v2_f_long', name:'Long Hair', slot:'hair', gender:'female', coins:12, img:'assets/images/v2/hair/f_long.png', x:400, y:150, w:300},
  {id:'v2_f_curly', name:'Curly Hair', slot:'hair', gender:'female', coins:12, img:'assets/images/v2/hair/f_curly.png', x:400, y:150, w:300},
  // Tops - chest at (400, 450)
  {id:'v2_m_tee', name:'Tee', slot:'top', gender:'male', coins:15, img:'assets/images/v2/tops/m_tee.png', x:400, y:450, w:380},
  {id:'v2_m_tank', name:'Tank', slot:'top', gender:'male', coins:15, img:'assets/images/v2/tops/m_tank.png', x:400, y:450, w:360},
  // Bottoms - hips at (400, 720)
  {id:'v2_m_jeans', name:'Jeans', slot:'bottom', gender:'male', coins:18, img:'assets/images/v2/bottoms/m_jeans.png', x:400, y:720, w:340},
  // Jewelry - neck at (400, 270)
  {id:'v2_chain', name:'Gold Chain', slot:'necklace', gender:'male', coins:20, img:'assets/images/v2/jewelry/chain.png', x:400, y:280, w:200},
];
let equipped = {};
let coins = 1000;
let owned = [];
function renderItems() {
  const grid = document.getElementById('item-grid');
  grid.innerHTML = '';
  ITEMS.forEach(item => {
    const card = document.createElement('div');
    card.className = 'item-card' + (equipped[item.slot]?.id === item.id ? ' equipped' : '');
    card.innerHTML = `<img src="${item.img}"><div>${item.name}</div><div class="coin-cost">${owned.includes(item.id) ? 'Owned' : item.coins + ' coins'}</div>`;
    card.onclick = () => toggleItem(item);
    grid.appendChild(card);
  });
}
function toggleItem(item) {
  if (equipped[item.slot]?.id === item.id) {
    delete equipped[item.slot];
  } else {
    if (!owned.includes(item.id)) {
      if (coins < item.coins) { alert('Not enough coins!'); return; }
      coins -= item.coins;
      owned.push(item.id);
      document.getElementById('coins').textContent = coins;
    }
    equipped[item.slot] = item;
  }
  renderAvatar();
  renderItems();
}
function renderAvatar() {
  const container = document.getElementById('avatar-container');
  container.querySelectorAll('.avatar-item').forEach(el => el.remove());
  Object.values(equipped).forEach(item => {
    const img = document.createElement('img');
    img.className = 'avatar-item';
    img.src = item.img;
    // Position: (x, y) is center point on 800x1200 base, w is width
    // Display at 400x600 (SCALE=0.5)
    const dw = item.w * SCALE;
    img.style.width = dw + 'px';
    img.style.left = (item.x * SCALE - dw/2) + 'px';
    // Height auto, top calculated from center y
    img.onload = () => {
      const dh = img.height;
      img.style.top = (item.y * SCALE - dh/2) + 'px';
    };
    // Fallback if already loaded
    if (img.complete) {
      const dh = img.naturalHeight * (dw / img.naturalWidth);
      img.style.height = dh + 'px';
      img.style.top = (item.y * SCALE - dh/2) + 'px';
    }
    container.appendChild(img);
  });
}
renderItems();
</script>
</body>
</html>
