<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8BFR Avatar Chat v2</title>
<style>
  body { font-family: system-ui; background: #0a0618; color: #fff; margin: 0; padding: 10px; }
  #avatar-select { text-align: center; margin: 10px; }
  #avatar-select button { background: #2a1a4a; color: white; border: 1px solid #a855f7; padding: 8px 16px; margin: 4px; border-radius: 8px; cursor: pointer; }
  #avatar-select button.active { background: #a855f7; }
  #avatar-container { position: relative; width: 400px; height: 600px; margin: 10px auto; background: #1a1030; border-radius: 12px; }
  #avatar-base { position: absolute; width: 100%; height: 100%; object-fit: contain; }
  .avatar-item { position: absolute; pointer-events: none; }
  .avatar-item[data-slot="hair"] { z-index: 10; }
  .avatar-item[data-slot="earrings"] { z-index: 5; }
  .avatar-item[data-slot="top"] { z-index: 3; }
  .avatar-item[data-slot="bottom"] { z-index: 2; }
  .avatar-item[data-slot="necklace"] { z-index: 4; }
  .avatar-item[data-slot="bracelet"] { z-index: 4; }
  .avatar-item[data-slot="shoes"] { z-index: 1; }
  #closet { max-width: 900px; margin: 0 auto; padding: 10px; }
  #coins-bar { text-align: center; font-size: 18px; margin: 10px; color: #fbbf24; }
  .category { margin: 15px 0; }
  .category h3 { color: #a855f7; margin: 8px 0; }
  .item-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .item-card { background: #1a1030; border-radius: 8px; padding: 8px; text-align: center; cursor: pointer; border: 2px solid transparent; }
  .item-card img { width: 100%; height: 70px; object-fit: contain; }
  .item-card.equipped { border-color: #a855f7; }
  .item-card .name { font-size: 12px; margin: 4px 0; }
  .coin-cost { color: #fbbf24; font-size: 11px; }
</style>
</head>
<body>
<div id="avatar-select">
  <button onclick="setAvatar('male','light')" id="btn-male-light">Male Light</button>
  <button onclick="setAvatar('male','dark')" id="btn-male-dark">Male Dark</button>
  <button onclick="setAvatar('female','light')" id="btn-female-light">Female Light</button>
  <button onclick="setAvatar('female','dark')" id="btn-female-dark">Female Dark</button>
</div>
<div id="avatar-container">
  <img id="avatar-base" src="assets/images/v2/bases/male_light.png" alt="avatar">
</div>
<div id="closet">
  <div id="coins-bar">Coins: <span id="coins">1000</span></div>
  <div id="categories"></div>
</div>
<script>
const SCALE = 0.5;
let currentGender = 'male';
let currentSkin = 'light';
let equipped = {};
let coins = parseInt(localStorage.getItem('v2_coins') || '1000');
let owned = JSON.parse(localStorage.getItem('v2_owned') || '[]');
const ITEMS = [
  {id:'v2_m_fade', name:'Fade', slot:'hair', gender:'male', coins:12, img:'assets/images/v2/hair/m_fade_v2.png', x:400, y:20, w:300, crop:0.6},
  {id:'v2_m_dreads', name:'Dreads', slot:'hair', gender:'male', coins:14, img:'assets/images/v2/hair/m_dreads_v2.png', x:400, y:20, w:300, crop:0.6},
  {id:'v2_m_buzz', name:'Buzz Cut', slot:'hair', gender:'male', coins:12, img:'assets/images/v2/hair/m_buzz_v2.png', x:400, y:20, w:250, crop:0.6},
  {id:'v2_m_curly', name:'Curly', slot:'hair', gender:'male', coins:12, img:'assets/images/v2/hair/m_curly_v2.png', x:400, y:20, w:300, crop:0.6},
  {id:'v2_m_sidepart', name:'Side Part', slot:'hair', gender:'male', coins:12, img:'assets/images/v2/hair/m_sidepart_v2.png', x:400, y:20, w:300, crop:0.6},
  {id:'v2_m_waves', name:'Waves', slot:'hair', gender:'male', coins:12, img:'assets/images/v2/hair/m_waves_v2.png', x:400, y:20, w:300, crop:0.6},
  {id:'v2_f_long', name:'Long Hair', slot:'hair', gender:'female', coins:12, img:'assets/images/v2/hair/f_long_v2.png', x:400, y:120, w:320},
  {id:'v2_f_curly', name:'Curly Hair', slot:'hair', gender:'female', coins:12, img:'assets/images/v2/hair/f_curly_v2.png', x:400, y:60, w:320},
  {id:'v2_f_bob', name:'Bob', slot:'hair', gender:'female', coins:12, img:'assets/images/v2/hair/f_bob_front.png', x:400, y:60, w:300},
  {id:'v2_m_tee', name:'8BFR Tee', slot:'top', gender:'male', coins:15, img:'assets/images/v2/tops/m_tee_8bfr.png', x:400, y:440, w:380},
  {id:'v2_m_tank', name:'8B Tank', slot:'top', gender:'male', coins:15, img:'assets/images/v2/tops/m_tank_8bfr.png', x:400, y:440, w:360},
  {id:'v2_f_croptop', name:'8BFR Crop Top', slot:'top', gender:'female', coins:15, img:'assets/images/v2/tops/f_croptop_8bfr.png', x:400, y:420, w:340},
  {id:'v2_f_blouse', name:'Blouse', slot:'top', gender:'female', coins:18, img:'assets/images/v2/tops/f_blouse.png', x:400, y:440, w:380},
  {id:'v2_f_dress', name:'Dress', slot:'top', gender:'female', coins:25, img:'assets/images/v2/tops/f_dress.png', x:400, y:550, w:400},
  {id:'v2_m_jeans', name:'Jeans', slot:'bottom', gender:'male', coins:18, img:'assets/images/v2/bottoms/m_jeans.png', x:400, y:680, w:340},
  {id:'v2_f_skirt', name:'Skirt', slot:'bottom', gender:'female', coins:18, img:'assets/images/v2/bottoms/f_skirt.png', x:400, y:650, w:320},
  {id:'v2_chain', name:'8B Chain', slot:'necklace', gender:'male', coins:20, img:'assets/images/v2/jewelry/chain_8b.png', x:400, y:280, w:200},
  {id:'v2_f_earrings', name:'Hoop Earrings', slot:'earrings', gender:'female', coins:15, img:'assets/images/v2/jewelry/f_earrings.png', x:400, y:140, w:260},
  {id:'v2_f_bracelet', name:'Bracelet', slot:'bracelet', gender:'female', coins:12, img:'assets/images/v2/jewelry/f_bracelet.png', x:170, y:620, w:60},
  {id:'v2_sneakers', name:'Sneakers', slot:'shoes', gender:'male', coins:20, img:'assets/images/v2/shoes/sneakers.png', x:400, y:1100, w:300},
  {id:'v2_heels', name:'Heels', slot:'shoes', gender:'female', coins:22, img:'assets/images/v2/shoes/heels.png', x:400, y:1100, w:280},
];
function setAvatar(gender, skin) {
  currentGender = gender; currentSkin = skin;
  document.getElementById('avatar-base').src = 'assets/images/v2/bases/' + gender + '_' + skin + '.png';
  document.querySelectorAll('#avatar-select button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + gender + '-' + skin).classList.add('active');
  equipped = {};
  renderAvatar(); renderItems();
}
function renderItems() {
  const container = document.getElementById('categories');
  container.innerHTML = '';
  const cats = {};
  ITEMS.filter(i => i.gender === currentGender).forEach(item => {
    if (!cats[item.slot]) cats[item.slot] = [];
    cats[item.slot].push(item);
  });
  const slotNames = {hair:'Hair', top:'Tops', bottom:'Bottoms', necklace:'Necklace', earrings:'Earrings', bracelet:'Bracelet', shoes:'Shoes'};
  for (const slot of Object.keys(cats)) {
    const div = document.createElement('div');
    div.className = 'category';
    div.innerHTML = '<h3>' + (slotNames[slot] || slot) + '</h3>';
    const grid = document.createElement('div');
    grid.className = 'item-grid';
    cats[slot].forEach(item => {
      const card = document.createElement('div');
      card.className = 'item-card' + (equipped[item.slot] && equipped[item.slot].id === item.id ? ' equipped' : '');
      const isOwned = owned.includes(item.id);
      card.innerHTML = '<img src="' + item.img + '" alt="' + item.name + '"><div class="name">' + item.name + '</div><div class="coin-cost">' + (isOwned ? 'Owned' : item.coins + ' coins') + '</div>';
      card.onclick = (function(it) { return function() { toggleItem(it); }; })(item);
      grid.appendChild(card);
    });
    div.appendChild(grid);
    container.appendChild(div);
  }
  document.getElementById('coins').textContent = coins;
}
function toggleItem(item) {
  if (equipped[item.slot] && equipped[item.slot].id === item.id) {
    delete equipped[item.slot];
  } else {
    if (!owned.includes(item.id)) {
      if (coins < item.coins) { alert('Not enough coins!'); return; }
      coins -= item.coins;
      owned.push(item.id);
      localStorage.setItem('v2_coins', coins);
      localStorage.setItem('v2_owned', JSON.stringify(owned));
    }
    equipped[item.slot] = item;
  }
  renderAvatar(); renderItems();
}
function renderAvatar() {
  const container = document.getElementById('avatar-container');
  container.querySelectorAll('.avatar-item').forEach(el => el.remove());
  Object.values(equipped).forEach(item => {
    const img = document.createElement('img');
    img.className = 'avatar-item';
    img.setAttribute('data-slot', item.slot);
    img.src = item.img;
    const dw = item.w * SCALE;
    img.style.width = dw + 'px';
    img.style.left = (item.x * SCALE - dw/2) + 'px';
    const place = function() {
      let dh = img.naturalHeight * (dw / img.naturalWidth);
      if (item.crop) dh = dh * item.crop;
      img.style.height = dh + 'px';
      img.style.top = (item.y * SCALE - dh/2) + 'px';
    };
    if (img.complete && img.naturalWidth) place();
    else img.onload = place;
    container.appendChild(img);
  });
}
document.getElementById('btn-male-light').classList.add('active');
renderItems();
</script>
</body>
</html>
